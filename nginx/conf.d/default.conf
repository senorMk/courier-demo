server {
    listen 80;
    server_name pcs-zambia.com www.pcs-zambia.com;

    # Serve ACME challenges from the *same* host path you pass to certbot (-w)
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;          # <— matches volume below
        try_files $uri =404;
    }

    # Temporarily serve the app over HTTP until certs exist
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name pcs-zambia.com www.pcs-zambia.com;

    ssl_certificate /etc/letsencrypt/live/pcs-zambia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcs-zambia.com/privkey.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}