# ------------------------------
# FRONTEND: courier.ceofficesolutions.com
# ------------------------------

# HTTP: redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name courier.ceofficesolutions.com;

  location ^~ /.well-known/acme-challenge/ {
    root /acme-webroot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: proxy to Angular container "frontend"
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name courier.ceofficesolutions.com;

  ssl_certificate     /etc/letsencrypt/live/courier.ceofficesolutions.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/courier.ceofficesolutions.com/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location /api {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

