# ------------------------------
# FRONTEND: courier.ceofficesolutions.com + www + wildcard
# ------------------------------

# HTTP: ACME + redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name courier.ceofficesolutions.com www.courier.ceofficesolutions.com *.courier.ceofficesolutions.com;

  # ACME challenges (matches docker volume: ./nginx/certs/.well-known -> /acme-webroot/.well-known)
  location ^~ /.well-known/acme-challenge/ {
    root /acme-webroot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: proxy to Angular container "frontend"
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name courier.ceofficesolutions.com www.courier.ceofficesolutions.com *.courier.ceofficesolutions.com;

  ssl_certificate     /etc/ssl/courier/courier_fullchain.crt;
  ssl_certificate_key /etc/ssl/courier/courier_wildcard.key;

  # Best-practice SSL settings
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://frontend;      # << Angular container (port 80 inside that container)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # SPA fallback (uncomment if needed)
    # error_page 404 =200 /index.html;
  }
}

# ------------------------------
# API: api.courier.ceofficesolutions.com
# ------------------------------

# HTTP: ACME + redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name api.courier.ceofficesolutions.com;

  location ^~ /.well-known/acme-challenge/ {
    root /acme-webroot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: proxy to NestJS container "app:3000"
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.courier.ceofficesolutions.com;

  ssl_certificate     /etc/ssl/courier/courier_fullchain.crt;
  ssl_certificate_key /etc/ssl/courier/courier_wildcard.key;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarded headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 300;
  }
}
