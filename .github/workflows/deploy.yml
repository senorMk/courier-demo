name: Build & Deploy (GHCR)

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/platinumproject2025/platinum-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (tag dev and dev-SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:dev
            ${{ env.GHCR_IMAGE }}:dev-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and pull+restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -Eeuo pipefail
            cd ~/projects/platinum-backend

            # If GHCR is PRIVATE, log in on the VPS for this session:
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_READ_USER }}" --password-stdin
            fi

            # Pull latest app image and (re)start services
            docker compose pull
            docker compose up -d

            # Optional: clean up old images
            docker image prune -f

            # Quick status
            docker compose ps
