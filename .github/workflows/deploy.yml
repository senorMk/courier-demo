name: Build & Deploy (GHCR)

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  # Change owner if needed
  GHCR_BACKEND: ghcr.io/platinumproject2025/pcs-zambia-backend
  GHCR_FRONTEND: ghcr.io/platinumproject2025/pcs-zambia-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Backend ----
      - name: Build & push BACKEND (dev + dev-SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_BACKEND }}:dev
            ${{ env.GHCR_BACKEND }}:dev-${{ github.sha }}

      # ---- Frontend ----
      - name: Build & push FRONTEND (dev + dev-SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_FRONTEND }}:dev
            ${{ env.GHCR_FRONTEND }}:dev-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and pull+restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -Eeuo pipefail
            cd ~/projects/pcs-zambia

            COMPOSE_FILE=docker-compose.yml

            # Login to GHCR for this session (private packages)
            echo "${{ secrets.GHCR_READ_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_READ_USER }}" --password-stdin

            # Pull latest images for backend & frontend (and infra if changed)
            sudo docker compose -f ${COMPOSE_FILE} pull

            # Restart stack
            sudo docker compose -f ${COMPOSE_FILE} up -d

            # Housekeeping
            sudo docker image prune -f

            # Status
            sudo docker compose -f ${COMPOSE_FILE} ps