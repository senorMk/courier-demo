<!-- User info with office name and email -->
<div class="flex items-center gap-2">
    <div class="flex flex-col items-end" *ngIf="userEmail || officeName">
        <span class="text-sm font-medium text-gray-700" *ngIf="officeName">{{ officeName }}</span>
        <span class="text-sm text-gray-600" *ngIf="userEmail">{{ userEmail }}</span>
    </div>
    <button mat-icon-button [matMenuTriggerFor]="userActions">
        <mat-icon [svgIcon]="'heroicons_outline:user'"></mat-icon>
    </button>
</div>

<mat-menu [xPosition]="'before'" #userActions="matMenu">
    <button mat-menu-item (click)="signOut()">
        <mat-icon [svgIcon]="'heroicons_outline:logout'"></mat-icon>
        <span>Log out</span>
    </button>
</mat-menu>
