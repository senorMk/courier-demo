<div class="flex flex-col gap-4" style="width: 100%; padding: 20px;">
  <div class="flex justify-end">
    <button mat-flat-button color="primary" class="custom-primary-btn" (click)="startNewSession()">
      <mat-icon style="color: #fff;">add</mat-icon>
      Start Scanning
    </button>
  </div>
  <div class="flex flex-col flex-1 min-h-0 bg-white rounded-lg shadow-md overflow-hidden">
    <table mat-table [dataSource]="recentSessions" style="width: 100%">
      <ng-container matColumnDef="route">
        <th mat-header-cell *matHeaderCellDef>Route</th>
        <td mat-cell *matCellDef="let session">{{ session.routeName }}</td>
      </ng-container>
      <ng-container matColumnDef="mode">
        <th mat-header-cell *matHeaderCellDef>Mode</th>
        <td mat-cell *matCellDef="let session">{{ session.mode | titlecase }}</td>
      </ng-container>
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Started At</th>
        <td mat-cell *matCellDef="let session">{{ session.createdAt | date: 'short' }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let session">
          <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 text-[10px] font-medium uppercase">{{ session.status }}</span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <mat-paginator [pageSize]="10"></mat-paginator>
</div>
