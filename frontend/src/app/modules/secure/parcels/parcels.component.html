<div class="flex flex-col gap-4" style="width: 100%; padding: 20px;">
  <div class="flex justify-end">
    <button mat-raised-button (click)="openCreateDialog()" class="custom-primary-btn">
      <mat-icon style="color: #fff;">add</mat-icon>
      Create Parcel
    </button>
  </div>
  <div class="flex flex-col flex-1 min-h-0 bg-white rounded-lg shadow-md overflow-hidden">
    <table mat-table [dataSource]="dataSource" style="width: 100%">
      <ng-container matColumnDef="parcelNumber">
        <th mat-header-cell *matHeaderCellDef>Number</th>
        <td mat-cell *matCellDef="let element">{{ element?.parcelNumber }}</td>
      </ng-container>
      <ng-container matColumnDef="customerId">
        <th mat-header-cell *matHeaderCellDef>Sender</th>
        <td mat-cell *matCellDef="let element">{{ element?.customer?.firstName }} {{ element?.customer?.lastName }}</td>
      </ng-container>
      <ng-container matColumnDef="receiverId">
        <th mat-header-cell *matHeaderCellDef>Receiver</th>
        <td mat-cell *matCellDef="let element">{{ element?.receiver?.firstName }} {{ element?.receiver?.lastName }}</td>
      </ng-container>
      <ng-container matColumnDef="destinationId">
        <th mat-header-cell *matHeaderCellDef>Destination</th>
        <td mat-cell *matCellDef="let element">{{ element?.office?.name }} {{ element?.office?.branchCode }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <mat-paginator [pageSize]="10"></mat-paginator>
</div>
