<div class="flex flex-col gap-4" style="width: 100%; padding: 20px;">
  <div class="flex justify-end">
  <button mat-raised-button (click)="openCreateDialog()" style="background-color: #fff; color: #000; border: 1px solid #ccc; padding: 20px;">Create Parcel</button>
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%">
    <ng-container matColumnDef="parcelNumber">
      <th mat-header-cell *matHeaderCellDef>Number</th>
      <td mat-cell *matCellDef="let element">{{ element.parcelNumber }}</td>
    </ng-container>
    <ng-container matColumnDef="customerId">
      <th mat-header-cell *matHeaderCellDef>Customer</th>
      <td mat-cell *matCellDef="let element">{{ element.customerId }}</td>
    </ng-container>
    <ng-container matColumnDef="receiverId">
      <th mat-header-cell *matHeaderCellDef>Receiver</th>
      <td mat-cell *matCellDef="let element">{{ element.receiverId }}</td>
    </ng-container>
    <ng-container matColumnDef="destinationId">
      <th mat-header-cell *matHeaderCellDef>Destination</th>
      <td mat-cell *matCellDef="let element">{{ element.destinationId }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="10"></mat-paginator>
</div>
