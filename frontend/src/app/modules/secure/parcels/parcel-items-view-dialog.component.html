<h1 mat-dialog-title
    style="font-size: 1.125rem; text-align: center; font-family: 'Inter', sans-serif; margin-bottom: 10px;">Parcel Items
</h1>
<div mat-dialog-content style="min-width: 400px;">
    <table mat-table [dataSource]="items" class="mat-elevation-z8" style="width: 100%; margin-bottom: 16px;">
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let item">{{ item.description }}</td>
        </ng-container>
        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef>Qty</th>
            <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
        </ng-container>
        <ng-container matColumnDef="pricePerUnit">
            <th mat-header-cell *matHeaderCellDef>Unit Price</th>
            <td mat-cell *matCellDef="let item">{{ item.pricePerUnit | currency:'ZMW ' }}</td>
        </ng-container>
        <ng-container matColumnDef="value">
            <th mat-header-cell *matHeaderCellDef>Value</th>
            <td mat-cell *matCellDef="let item">{{ item.value | currency:'ZMW ' }}</td>
        </ng-container>
        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let item">{{ item.amount | currency:'ZMW ' }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <div style="text-align: right; font-weight: bold; font-size: 1.1em;">
        Total: {{ getTotal() | currency:'ZMW ' }}
    </div>
</div>
<div mat-dialog-actions style="display: flex; justify-content: center;">
    <button mat-button (click)="closeDialog()" style="border: 1px solid #ccc;">Close</button>
</div>
