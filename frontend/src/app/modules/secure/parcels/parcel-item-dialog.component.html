<h1 mat-dialog-title
  style="font-size: 1.125rem; text-align: center; font-family: 'Inter', sans-serif; margin-bottom: 10px;">
  Add Parcel Item
</h1>
<div mat-dialog-content [formGroup]="form" class="flex flex-col gap-4">
  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <input matInput formControlName="description" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Quantity</mat-label>
    <input matInput type="number" formControlName="quantity" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Price Per Unit</mat-label>
    <input matInput type="number" formControlName="pricePerUnit" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Value</mat-label>
    <input matInput type="number" formControlName="value" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount" readonly />
  </mat-form-field>

  style="display: flex; justify-content: center; align-items: center; gap: 12px;"
>
  <button
    style="background-color: #1D4ED8; color: white;"
    mat-flat-button
    (click)="save()"
    cdkFocusInitial
    class="custom-primary-btn"
  >
    Save
  </button>
  <button
    mat-flat-button
    [mat-dialog-close]="false"
    style="border: 1.5px solid #888; background: transparent;"
  >
    Cancel
  </button>
</div>
