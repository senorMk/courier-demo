<h2 mat-dialog-title>{{ data.title }}</h2>
<div mat-dialog-content *ngIf="data.message as message">
  {{ message }}
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)">
    {{ data.cancelLabel }}
  </button>
  <button mat-flat-button color="primary" type="button" (click)="close(true)" cdkFocusInitial>
    {{ data.confirmLabel }}
  </button>
</div>
