services:
  # ---------- Infra ----------
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-courier}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-courier}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------- Backend (NestJS) - PRODUCTION ----------
  app:
    image: ghcr.io/senormk/courier-backend:prod
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["3000"]   # nginx talks to http://app:3000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------- Frontend (Angular, static) - PRODUCTION ----------
  frontend:
    image: ghcr.io/senormk/courier-frontend:prod
    expose: ["80"]     # nginx talks to http://frontend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Edge Reverse Proxy - PRODUCTION ----------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./nginx/conf.d-prod:/etc/nginx/conf.d:ro
      - /etc/ssl/courier:/etc/ssl/courier:ro
      - ./nginx/certs/.well-known:/acme-webroot/.well-known:rw
    restart: always

volumes:
  postgres_data:
    external: true
    name: postgres_data
